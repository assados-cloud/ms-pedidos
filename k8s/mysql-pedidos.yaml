apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pedidos
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-pedidos
spec:
  selector:
    app: mysql-pedidos
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-pedidos
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mysql-pedidos
  template:
    metadata:
      labels:
        app: mysql-pedidos
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: pedidosdb
            - name: MYSQL_USER
              value: pedidos
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ms-pedidos
                  key: MYSQL_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ms-pedidos
                  key: MYSQL_ROOT_PASSWORD
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -u"$MYSQL_USER" -p"$MYSQL_PASSWORD"
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: dados
              mountPath: /var/lib/mysql
              # O volume EBS formatado traz a pasta lost+found; o MySQL precisa de um diretório vazio.
              subPath: mysql
      volumes:
        - name: dados
          persistentVolumeClaim:
            claimName: mysql-pedidos
