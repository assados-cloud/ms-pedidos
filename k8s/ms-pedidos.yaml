apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-pedidos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-pedidos
  template:
    metadata:
      labels:
        app: ms-pedidos
    spec:
      containers:
        - name: ms-pedidos
          image: ms-pedidos:local
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: MYSQL_HOST
              value: mysql-pedidos
            - name: MYSQL_USER
              value: pedidos
            - name: MYSQL_DATABASE
              value: pedidosdb
            - name: CARDAPIO_URL
              value: http://ms-cardapio:8080
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ms-pedidos
                  key: MYSQL_PASSWORD
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: ms-pedidos
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ms-pedidos
                  key: RABBITMQ_PASSWORD
          readinessProbe:
            httpGet:
              path: /pedidos/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
