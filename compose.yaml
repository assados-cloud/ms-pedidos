services:
  mysql-pedidos:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: pedidosdb
      MYSQL_USER: pedidos
      MYSQL_PASSWORD: pedidos-local
      MYSQL_ROOT_PASSWORD: root-local
    volumes:
      - pedidos-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-upedidos", "-ppedidos-local"]
      interval: 5s
      timeout: 5s
      retries: 30

  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: pedidos
      RABBITMQ_DEFAULT_PASS: rabbitmq-local
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_listener", "5672"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:15672:15672"

  ms-pedidos:
    build: .
    environment:
      MYSQL_HOST: mysql-pedidos
      MYSQL_USER: pedidos
      MYSQL_PASSWORD: pedidos-local
      MYSQL_DATABASE: pedidosdb
      RABBITMQ_URL: amqp://pedidos:rabbitmq-local@rabbitmq:5672/%2F
      # Aponta para o ms-cardapio real. Padrão: Cardápio rodando na sua máquina na porta 8080.
      CARDAPIO_URL: ${CARDAPIO_URL:-http://host.docker.internal:8080}
      PORT: "3000"
    depends_on:
      mysql-pedidos:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pedidos-data:
